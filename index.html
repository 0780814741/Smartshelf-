<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartShelf</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#10161d;--card:#18212b;--ink:#eaf0f5;--mut:#9aa8b6;--line:#2b3744;--acc:#7fb4ea;--on:#0b1722;--wa:#58c98a;--dng:#f08a76;--rule:#212c37;--gain:#6fd49b;color-scheme:dark}
*{box-sizing:border-box}

.app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:700;font-size:20px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--mut);padding:8px 12px;font:inherit;font-size:14px;min-height:40px}
.lang button.on{background:var(--acc);color:var(--on);font-weight:700}

.btn.on{background:var(--acc);color:var(--on);border-color:var(--acc)}

.prod span{display:block;color:var(--mut);font-size:14px}
.prod .low{color:var(--dng)}
.form{background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:14px;margin-bottom:12px}

input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:8px 12px}

.line{margin:12px 0 4px;font-weight:700}
.err{color:var(--dng);font-size:15px;min-height:22px;margin-top:6px}

.row{padding:12px 14px;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.rtop{display:flex;align-items:center;gap:10px}
.rname{flex:1;min-width:0;background:none;border:0;text-align:left;font:inherit;color:var(--ink);padding:4px 0;cursor:pointer}
.rname b{display:block;font-size:18px}
.rname span{display:block;color:var(--mut);font-size:14px}
.rval{font-weight:700;font-size:18px;white-space:nowrap;text-align:right}

.panel .m{color:var(--mut)}
.link{border:0;background:none;color:var(--dng);font:inherit;font-size:14px;padding:8px;min-height:40px;cursor:pointer}
.empty{padding:22px 16px;text-align:center;color:var(--mut)}
h3{font-size:15px;color:var(--mut);font-weight:400;margin:14px 4px 6px}
.toast{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:14px;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast button{border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;min-height:40px;padding:0 6px;cursor:pointer}
.note{color:var(--mut);font-size:13px;text-align:center;margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
